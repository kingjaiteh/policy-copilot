version: 2

models:
  - name: document_chunks
    description: >
      Unified chunk table across both corpora. This is the table the AI Search
      index reads from, which raises the stakes on its tests: a duplicate or
      null key here does not just produce bad analytics, it corrupts retrieval
      and the agent cites the wrong thing.
    columns:
      - name: chunk_id
        description: >
          Primary key for the vector index. Deliberately NOT named `_id`, which
          is reserved by AI Search and will cause index creation to fail.
        tests:
          # CRITICAL, both. Vector index sync keys on this.
          - not_null: {config: {severity: error}}
          - unique: {config: {severity: error}}

      - name: chunk_text
        description: Text that gets embedded. Prefixed with title and heading for context.
        tests:
          - not_null: {config: {severity: error}}

      - name: doc_type
        tests:
          - not_null: {config: {severity: error}}
          - accepted_values:
              values: ["sorn", "nist_control"]
              config: {severity: error}

      - name: chunk_type
        tests:
          - accepted_values:
              values: ["section", "routine_use", "control", "control_enhancement"]
              config: {severity: error}

      - name: chunk_strategy
        description: >
          A/B harness tag. 'standard' chunks appear in both arms.
          'oversized_whole' is arm A only; 'sub_split' is arm B only.
          Arm A is chunk_strategy != 'sub_split', arm B is
          chunk_strategy != 'oversized_whole'. See eval/README.md.
        tests:
          - not_null: {config: {severity: error}}
          - accepted_values:
              values: ["standard", "oversized_whole", "sub_split"]
              config: {severity: error}

      - name: section_key
        description: >
          Harmonized section key, or null for NIST controls. Carried into gold
          so the eval harness has an ARM-INDEPENDENT grading key: chunk_id
          differs between arms by construction (`:sec:purpose` vs
          `:sec:purpose:p0`), so ground truth cannot be expressed in chunk_ids
          without silently scoring arm B as a total miss on every question.

    tests:
      # WARN. Very short chunks embed poorly: they carry too little signal to
      # match a query, so they either never surface or surface spuriously.
      # Tolerate a handful, investigate if it becomes common.
      - dbt_utils.expression_is_true:
          expression: "chunk_char_count >= 50"
          config:
            severity: warn
            warn_if: ">0"
            error_if: ">25"

      # CRITICAL. The embedding model truncates past its context window rather
      # than erroring, so an over-length chunk silently loses its tail and that
      # content becomes unretrievable while still looking present in the table.
      #
      # 'oversized_whole' rows are EXEMPT BY DESIGN: they exist precisely to be
      # the un-split control arm, so flagging them would be flagging the
      # experiment itself. Everything else must stay under the ceiling, and for
      # sub_split parts in particular a breach means the splitter is not doing
      # its job -- which is why this is an error and not a warn.
      #
      # Threshold reads from the same var the models split on, so it cannot
      # drift away from them when the embedding model changes.
      - dbt_utils.expression_is_true:
          expression: "chunk_char_count <= {{ var('embed_max_chars') }}"
          where: "chunk_strategy != 'oversized_whole'"
          config:
            severity: error
