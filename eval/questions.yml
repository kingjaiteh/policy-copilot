# Retrieval evaluation set for Policy Copilot.
#
# GROUND TRUTH IS (source_id, section_key), NOT chunk_id.
#
#   This is the single most important design decision in the file. chunk_id
#   differs between the two arms by construction -- arm A returns
#   'sorn:DHS/CBP-024:sec:policies_retention', arm B returns that same content
#   as ':p0', ':p1', ':p2'. Labelling ground truth with chunk_ids would score
#   arm B as a total miss on every contested question and the A/B would report
#   a landslide for arm A that is pure artefact.
#
#   (source_id, section_key) is stable across arms, which is why gold carries
#   section_key as a real column. For NIST, section_key is null and source_id
#   is the control id.
#
# TWO CLASSES OF QUESTION, AND WHY BOTH ARE HERE:
#
#   contested  the answer lives in a section that IS over the embedding
#              ceiling, so the arms genuinely differ. These are the only
#              questions that can move the numbers.
#
#   control    the answer lives in a chunk that is identical in both arms
#              (a routine use, a short section, a NIST control).
#
#              They are NOT expected to score identically -- arm B holds more
#              chunks, which compete for the same top-k slots. What harness.py
#              measures over them is CROWDING, the cost of that competition,
#              and the contested gain should be read net of it. The hard
#              validity check is structural and runs over the corpus, not over
#              these scores; see eval/README.md.
#
# `answer_locus` records WHERE in the section the answer sits. Splitting should
# help most for 'tail' -- content far enough into a long section that a whole
# section embedding dilutes it, and that truncation would drop outright.

questions:

  # --- contested: answer inside an over-ceiling section --------------------

  - id: q01
    question: How long does CBP retain raw, unevaluated threat reporting in its intelligence records system?
    targets: [{source_id: "DHS/CBP-024", section_key: policies_retention}]
    class: contested
    answer_locus: middle
    note: Answer is "thirty (30) years", item 2 of a numbered retention list.

  - id: q02
    question: Which CBP intelligence products are kept as permanent records and transferred to the National Archives after twenty years?
    targets: [{source_id: "DHS/CBP-024", section_key: policies_retention}]
    class: contested
    answer_locus: tail
    note: Finished Intelligence Case Files. Last item in the section.

  - id: q03
    question: Does CBP's intelligence records system include lost and stolen passport data?
    targets: [{source_id: "DHS/CBP-024", section_key: categories_of_records}]
    class: contested
    answer_locus: middle

  - id: q04
